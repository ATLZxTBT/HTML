<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Survey</title>
</head>
<body>
<div class="conteiner">
    <h1>formulario</h1>
    <p>prenche sabosta ai</p>

    <form action="/processar" method="POST">
        <div class="campo">
            <label for="nome">nome: </label>
            <input type="text" id="nome" name="nome" required>
        </div>
        <div class="campo">
            <label for="idade">idade: </label>
            <input type="number" id="idade" name="idade" required>
        </div>
        <div class="campo">

        </div>
        <div class="campo">
            <select name="curso" id="curso">
                <option value="">selecione</option>
                <option value="">python</option>
                <option value="">flask</option>
                <option value="">html/css</option>
            </select>
        </div>
    </form>
</div>
<!-- area onde o esultado vai aparecer preenchido pelo flask-->
<div class="resultado">
    <h3>resultado:</h3>
    <!--isso é um comentario JINJA2 (template do flask)
    o resultado sera subistituido pelo text que o py enviar-->
    <p>{{ resultado }}</p>
</div>
</body>
</html>
